<!-- Header -->
<div class="bg-white border-bottom py-4">
  <div class="container">
    <h1 class="page-title mb-1">Browse Companies</h1>
    <p class="text-muted mb-0">Discover top employers in Bangladesh</p>
  </div>
</div>

<div class="container py-4">
  <div class="row g-4">

    <!-- Filters -->
    <div class="col-lg-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h6 class="fw-semibold mb-3">Filters</h6>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Search</label>
            <input type="text" class="form-control" placeholder="Company name..." [(ngModel)]="searchQuery" (ngModelChange)="onFilterChange()" />
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Industry</label>
            <select class="form-select" [(ngModel)]="selectedIndustry" (ngModelChange)="onFilterChange()">
              <option value="">All Industries</option>
              <option *ngFor="let ind of industries" [value]="ind">{{ ind }}</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Location</label>
            <select class="form-select" [(ngModel)]="selectedLocation" (ngModelChange)="onFilterChange()">
              <option value="">All Locations</option>
              <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Company cards -->
    <div class="col-lg-9">
      <p class="text-muted mb-3"><strong>{{ companies.length }}</strong> companies found</p>
      <div class="row g-4 mb-4">
        <div class="col-md-4" *ngFor="let co of companies">
          <app-company-card
            [companyId]="co.companyId"
            [name]="co.name"
            [industry]="co.industry"
            [location]="co.location"
            [jobCount]="co.jobCount"
            [size]="co.size">
          </app-company-card>
        </div>
      </div>
      <div class="d-flex justify-content-center">
        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination>
      </div>
    </div>

  </div>
</div>
