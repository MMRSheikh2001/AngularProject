<!-- Header -->
<div class="bg-white border-bottom py-4">
  <div class="container">
    <h1 class="page-title mb-1">Browse Gigs</h1>
    <p class="text-muted mb-0">Find the perfect freelance service for your project</p>
  </div>
</div>

<div class="container py-4">
  <div class="row g-4">

    <!-- Filters -->
    <div class="col-lg-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h6 class="fw-semibold mb-3">Filters</h6>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Search</label>
            <input type="text" class="form-control" placeholder="Search gigs..." [(ngModel)]="searchQuery" (ngModelChange)="onFilterChange()" />
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Category</label>
            <select class="form-select" [(ngModel)]="selectedCategory" (ngModelChange)="onFilterChange()">
              <option value="">All Categories</option>
              <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
            </select>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold">Price Range</label>
            <select class="form-select" [(ngModel)]="selectedPrice" (ngModelChange)="onFilterChange()">
              <option value="">Any Price</option>
              <option *ngFor="let p of priceRanges" [value]="p">{{ p }}</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <!-- Gig cards -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted mb-0"><strong>{{ gigs.length }}</strong> gigs found</p>
        <select class="form-select form-select-sm w-auto">
          <option>Best Selling</option>
          <option>Newest</option>
          <option>Price: Low to High</option>
          <option>Price: High to Low</option>
        </select>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-4" *ngFor="let gig of gigs">
          <app-gig-card
            [gigId]="gig.gigId"
            [title]="gig.title"
            [sellerName]="gig.sellerName"
            [price]="gig.price"
            [rating]="gig.rating"
            [reviewCount]="gig.reviewCount"
            [category]="gig.category">
          </app-gig-card>
        </div>
      </div>

      <div class="d-flex justify-content-center">
        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination>
      </div>
    </div>

  </div>
</div>
