<!-- Page Header -->
<div class="bg-white border-bottom py-4">
  <div class="container">
    <h1 class="page-title mb-1">Browse Jobs</h1>
    <p class="text-muted mb-0">Find your next career opportunity</p>
  </div>
</div>

<div class="container py-4">
  <div class="row g-4">

    <!-- Filters sidebar -->
    <div class="col-lg-3">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h6 class="fw-semibold mb-0">Filters</h6>
            <button class="btn btn-link btn-sm p-0 text-decoration-none" (click)="clearFilters()">Clear All</button>
          </div>

          <!-- Search -->
          <div class="mb-3">
            <label class="form-label small fw-semibold">Keywords</label>
            <input type="text" class="form-control" placeholder="Job title, skill..." [(ngModel)]="searchQuery" (ngModelChange)="onSearch()" />
          </div>

          <!-- City -->
          <div class="mb-3">
            <label class="form-label small fw-semibold">City</label>
            <select class="form-select" [(ngModel)]="selectedCity" (ngModelChange)="onFilterChange()">
              <option value="">All Cities</option>
              <option *ngFor="let city of cities" [value]="city">{{ city }}</option>
            </select>
          </div>

          <!-- Job Type -->
          <div class="mb-3">
            <label class="form-label small fw-semibold">Job Type</label>
            <select class="form-select" [(ngModel)]="selectedType" (ngModelChange)="onFilterChange()">
              <option value="">All Types</option>
              <option *ngFor="let type of jobTypes" [value]="type">{{ type }}</option>
            </select>
          </div>

          <!-- Salary -->
          <div class="mb-3">
            <label class="form-label small fw-semibold">Salary Range</label>
            <select class="form-select" [(ngModel)]="selectedSalary" (ngModelChange)="onFilterChange()">
              <option value="">Any Salary</option>
              <option *ngFor="let s of salaryRanges" [value]="s">{{ s }}</option>
            </select>
          </div>

        </div>
      </div>
    </div>

    <!-- Job list -->
    <div class="col-lg-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <p class="text-muted mb-0">Showing <strong>{{ jobs.length }}</strong> jobs</p>
        <select class="form-select form-select-sm w-auto">
          <option>Newest First</option>
          <option>Salary: High to Low</option>
          <option>Salary: Low to High</option>
        </select>
      </div>

      <div class="row g-4 mb-4">
        <div class="col-md-6" *ngFor="let job of jobs">
          <app-job-card
            [jobId]="job.jobId"
            [title]="job.title"
            [company]="job.company"
            [location]="job.location"
            [salary]="job.salary"
            [jobType]="job.jobType"
            [deadline]="job.deadline">
          </app-job-card>
        </div>
      </div>

      <!-- Pagination -->
      <div class="d-flex justify-content-center">
        <app-pagination [currentPage]="currentPage" [totalPages]="totalPages" (pageChange)="onPageChange($event)"></app-pagination>
      </div>
    </div>

  </div>
</div>
