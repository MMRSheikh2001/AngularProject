<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Job Applicants</h5>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">Applicant Name</th>
            <th>Email</th>
            <th>Target Job</th>
            <th>Date Applied</th>
            <th>Status</th>
            <th class="text-center px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of applicants">
            <td class="px-4 fw-semibold">{{ app.name }}</td>
            <td class="text-muted">{{ app.email }}</td>
            <td class="fw-semibold text-secondary">{{ app.jobTitle }}</td>
            <td class="text-muted">{{ app.appliedDate }}</td>
            <td>
              <span class="badge px-3 py-2 text-capitalize" [class]="getStatusClass(app.status)">
                {{ app.status }}
              </span>
            </td>
            <td class="text-center px-4">
              <div class="d-flex gap-2 justify-content-center" *ngIf="app.status !== 'Hired' && app.status !== 'Rejected'">
                <button type="button" class="btn btn-outline-primary btn-sm" (click)="updateStatus(app, 'Shortlisted')">
                  Shortlist
                </button>
                <button type="button" class="btn btn-success btn-sm" (click)="updateStatus(app, 'Hired')">
                  Hire
                </button>
                <button type="button" class="btn btn-danger btn-sm" (click)="updateStatus(app, 'Rejected')">
                  Reject
                </button>
              </div>
              <span class="text-muted small" *ngIf="app.status === 'Hired' || app.status === 'Rejected'">
                Decision finalized
              </span>
            </td>
          </tr>
          <tr *ngIf="applicants.length === 0">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="bi bi-people" style="font-size: 3rem;"></i>
              <h6 class="mt-3">No Applicants Found</h6>
              <p class="small mb-0">No job seekers have applied to your job postings yet.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
