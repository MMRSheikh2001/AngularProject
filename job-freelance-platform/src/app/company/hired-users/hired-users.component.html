<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Hired Professionals</h5>
  <a routerLink="/freelancers" class="btn btn-primary btn-sm"><i class="bi bi-search me-1"></i>Find Freelancers</a>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">Professional</th>
            <th>Email</th>
            <th>Role</th>
            <th>Hourly Rate</th>
            <th>Hired Date</th>
            <th class="text-center px-4">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let hire of hires">
            <td class="px-4 fw-semibold">{{ hire.name }}</td>
            <td class="text-muted">{{ hire.email }}</td>
            <td><span class="badge bg-secondary bg-opacity-10 text-secondary">{{ hire.role }}</span></td>
            <td class="fw-bold">{{ hire.rate }}</td>
            <td class="text-muted">{{ hire.hireDate }}</td>
            <td class="text-center px-4">
              <span class="badge rounded-pill px-3 py-2" [class.bg-success]="hire.status === 'Active'" [class.bg-secondary]="hire.status === 'Completed'">
                {{ hire.status }}
              </span>
            </td>
          </tr>
          <tr *ngIf="hires.length === 0">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="bi bi-person-check" style="font-size: 3rem;"></i>
              <h6 class="mt-3">No Hired Professionals</h6>
              <p class="small mb-0">You haven't hired any freelancers or employees yet.</p>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
