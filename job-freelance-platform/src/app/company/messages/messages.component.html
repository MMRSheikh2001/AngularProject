<div class="card border-0 shadow-sm overflow-hidden" style="height: calc(100vh - 160px);">
  <div class="row g-0 h-100">

    <!-- Conversations sidebar -->
    <div class="col-md-4 border-end h-100 d-flex flex-column bg-white">
      <div class="p-3 border-bottom">
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0"><i class="bi bi-search"></i></span>
          <input type="text" class="form-control bg-light border-start-0" placeholder="Search applicants..." />
        </div>
      </div>
      <div class="flex-grow-1 overflow-y-auto">
        <div
          *ngFor="let conv of conversations"
          class="p-3 border-bottom cursor-pointer d-flex align-items-center gap-3"
          [class.bg-light]="conv.id === selectedConversation"
          (click)="selectConversation(conv.id)"
        >
          <div class="avatar-circle flex-shrink-0" style="width: 44px; height: 44px;">
            {{ conv.initial }}
          </div>
          <div class="flex-grow-1 min-w-0">
            <div class="d-flex justify-content-between align-items-baseline mb-1">
              <h6 class="fw-semibold mb-0 text-truncate" style="font-size: 0.95rem;">{{ conv.name }}</h6>
              <small class="text-muted" style="font-size: 0.75rem;">{{ conv.time }}</small>
            </div>
            <p class="mb-0 text-muted text-truncate small">{{ conv.lastMessage }}</p>
          </div>
          <span *ngIf="conv.unread > 0" class="badge rounded-pill bg-danger" style="font-size: 0.75rem;">
            {{ conv.unread }}
          </span>
        </div>
      </div>
    </div>

    <!-- Message bubble column -->
    <div class="col-md-8 h-100 d-flex flex-column bg-light bg-opacity-25">
      <div *ngIf="activeConversation" class="h-100 d-flex flex-column">
        <div class="p-3 bg-white border-bottom d-flex align-items-center gap-3">
          <div class="avatar-circle" style="width: 40px; height: 40px;">
            {{ activeConversation.initial }}
          </div>
          <div>
            <h6 class="fw-semibold mb-0">{{ activeConversation.name }}</h6>
            <small class="text-success small"><span class="spinner-grow spinner-grow-sm text-success me-1" style="width: 8px; height: 8px;"></span>Online</small>
          </div>
        </div>

        <div class="flex-grow-1 p-3 overflow-y-auto d-flex flex-column gap-3">
          <div
            *ngFor="let msg of activeMessages"
            class="d-flex flex-column"
            [class.align-items-end]="msg.sent"
            [class.align-items-start]="!msg.sent"
          >
            <div [class]="msg.sent ? 'bubble-sent' : 'bubble-received'">
              {{ msg.text }}
            </div>
            <small class="text-muted mt-1 px-2" style="font-size: 0.7rem;">{{ msg.time }}</small>
          </div>
        </div>

        <div class="p-3 bg-white border-top">
          <form (ngSubmit)="sendMessage()" class="d-flex gap-2">
            <button type="button" class="btn btn-light"><i class="bi bi-paperclip"></i></button>
            <input
              type="text"
              class="form-control"
              placeholder="Type a message to applicant..."
              [(ngModel)]="newMessage"
              name="newMessage"
              required
            />
            <button type="submit" class="btn btn-primary"><i class="bi bi-send-fill"></i></button>
          </form>
        </div>
      </div>

      <div *ngIf="!activeConversation" class="h-100 d-flex flex-column justify-content-center align-items-center text-muted">
        <i class="bi bi-chat-left-text" style="font-size: 4rem;"></i>
        <h5 class="mt-3">No Active Chat</h5>
        <p class="small">Choose an applicant or freelancer from the left side panel to chat.</p>
      </div>
    </div>

  </div>
</div>
