<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Purchased Gigs</h5>
  <a routerLink="/gigs" class="btn btn-success btn-sm"><i class="bi bi-cart me-1"></i>Order a Gig</a>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">Order ID</th>
            <th>Seller</th>
            <th>Gig Title</th>
            <th>Amount Paid</th>
            <th>Order Date</th>
            <th class="text-center px-4">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let order of purchasedGigs">
            <td class="px-4 fw-semibold text-primary">{{ order.orderId }}</td>
            <td class="fw-semibold">{{ order.sellerName }}</td>
            <td class="text-muted">{{ order.gigTitle }}</td>
            <td class="fw-bold">৳{{ order.amount }}</td>
            <td class="text-muted">{{ order.orderDate }}</td>
            <td class="text-center px-4">
              <span class="badge px-3 py-2 text-capitalize" [class]="getStatusClass(order.status)">
                {{ order.status }}
              </span>
            </td>
          </tr>
          <tr *ngIf="purchasedGigs.length === 0">
            <td colspan="6" class="text-center py-5 text-muted">
              <i class="bi bi-cart" style="font-size: 3rem;"></i>
              <h6 class="mt-3">No Gigs Purchased</h6>
              <p class="small mb-0">You haven't purchased any freelance gigs yet.</p>
              <a routerLink="/gigs" class="btn btn-success btn-sm mt-3">Browse Gigs</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
