<div class="min-vh-100 d-flex align-items-center bg-light py-5">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">

        <!-- Brand -->
        <div class="text-center mb-4">
          <a routerLink="/home" class="text-decoration-none">
            <h2 class="fw-bold text-primary"><i class="bi bi-briefcase-fill me-2"></i>WorkBridge</h2>
          </a>
          <p class="text-muted">Sign in to your account</p>
        </div>

        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">
            <h5 class="fw-semibold mb-4">Welcome Back</h5>

            <form #loginForm="ngForm" (ngSubmit)="login()">
              <div class="mb-3">
                <label for="loginEmail" class="form-label fw-semibold">Email Address</label>
                <input type="email" id="loginEmail" class="form-control" placeholder="your@email.com"
                       [(ngModel)]="email" name="email" required email #emailCtrl="ngModel" />
                <div *ngIf="emailCtrl.invalid && emailCtrl.touched" class="text-danger small mt-1">Please enter a valid email.</div>
              </div>

              <div class="mb-3">
                <div class="d-flex justify-content-between">
                  <label for="loginPassword" class="form-label fw-semibold">Password</label>
                  <a routerLink="/forgot-password" class="small text-primary text-decoration-none">Forgot password?</a>
                </div>
                <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password"
                       [(ngModel)]="password" name="password" required #passwordCtrl="ngModel" />
                <div *ngIf="passwordCtrl.invalid && passwordCtrl.touched" class="text-danger small mt-1">Password is required.</div>
              </div>

              <button type="submit" [disabled]="loginForm.invalid" class="btn btn-primary w-100">Sign In</button>
            </form>

            <hr class="my-3">

            <p class="text-center text-muted small mb-0">
              Don't have an account?
              <a routerLink="/register" class="text-primary fw-semibold text-decoration-none">Register here</a>
            </p>
          </div>
        </div>

        <!-- Quick access -->
        <div class="card border-0 shadow-sm mt-3">
          <div class="card-body p-3">
            <p class="small text-muted mb-2 fw-semibold">Quick Access (Demo)</p>
            <div class="d-flex gap-2 flex-wrap">
              <a routerLink="/user/dashboard" class="btn btn-sm btn-outline-primary">User Dashboard</a>
              <a routerLink="/company/dashboard" class="btn btn-sm btn-outline-secondary">Company Dashboard</a>
              <a routerLink="/admin/dashboard" class="btn btn-sm btn-outline-danger">Admin Panel</a>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>
