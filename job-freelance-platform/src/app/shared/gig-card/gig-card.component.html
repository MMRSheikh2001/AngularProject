<div class="card border-0 shadow-sm h-100 card-hover">

  <!-- Gig image/thumbnail -->
  <div class="bg-light d-flex align-items-center justify-content-center" style="height:160px; border-radius:8px 8px 0 0;">
    <i class="bi bi-image text-muted" style="font-size:3rem;"></i>
  </div>

  <div class="card-body">

    <!-- Category badge -->
    <span class="badge bg-info bg-opacity-10 text-info small mb-2">{{ category }}</span>

    <!-- Title -->
    <h6 class="fw-semibold mb-2" style="line-height:1.4;">{{ title }}</h6>

    <!-- Seller info -->
    <div class="d-flex align-items-center gap-2 mb-2">
      <div class="avatar-circle" style="width:28px;height:28px;font-size:0.75rem;">
        {{ sellerName.charAt(0) }}
      </div>
      <small class="text-muted">{{ sellerName }}</small>
    </div>

    <!-- Rating -->
    <div class="d-flex align-items-center gap-1 mb-3">
      <i class="bi bi-star-fill text-warning small"></i>
      <small class="fw-semibold">{{ rating }}</small>
      <small class="text-muted">({{ reviewCount }})</small>
    </div>

    <!-- Price & action -->
    <div class="d-flex justify-content-between align-items-center">
      <span class="fw-bold text-primary">৳{{ price }}</span>
      <a [routerLink]="['/gigs', gigId]" class="btn btn-sm btn-outline-primary">View Gig</a>
    </div>

  </div>
</div>
