<div class="dropdown">
  <button
    class="btn btn-light position-relative"
    type="button"
    id="notifDropdown"
    data-bs-toggle="dropdown"
    aria-expanded="false"
  >
    <i class="bi bi-bell fs-5"></i>
    <span
      *ngIf="unreadCount > 0"
      class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
    >
      {{ unreadCount }}
    </span>
  </button>

  <div class="dropdown-menu dropdown-menu-end p-0" style="width: 340px;" aria-labelledby="notifDropdown">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center px-3 py-2 border-bottom">
      <h6 class="mb-0 fw-semibold">Notifications</h6>
      <button class="btn btn-link btn-sm p-0 text-decoration-none" (click)="markAllRead()">
        Mark all read
      </button>
    </div>

    <!-- Notification items -->
    <ul class="list-unstyled mb-0" style="max-height: 300px; overflow-y: auto;">
      <li
        *ngFor="let notif of notifications"
        class="px-3 py-2 border-bottom"
        [class.bg-light]="!notif.read"
      >
        <p class="mb-0 small">{{ notif.text }}</p>
        <small class="text-muted">{{ notif.time }}</small>
      </li>
    </ul>

    <!-- Footer -->
    <div class="text-center py-2">
      <a href="#" class="small text-primary text-decoration-none">View all notifications</a>
    </div>
  </div>
</div>
