<div class="sidebar d-flex flex-column py-3">

  <!-- Brand -->
  <div class="px-4 mb-4">
    <a routerLink="/home" class="text-white text-decoration-none d-flex align-items-center gap-2">
      <i class="bi bi-briefcase-fill fs-5"></i>
      <span class="fw-bold fs-5">WorkBridge</span>
    </a>
    <small class="text-secondary mt-1 d-block">{{ roleLabel }}</small>
  </div>

  <!-- Nav links -->
  <nav class="flex-grow-1">
    <ul class="nav flex-column px-2">
      <li class="nav-item mb-1" *ngFor="let link of activeLinks">
        <a
          class="nav-link d-flex align-items-center gap-2"
          [routerLink]="link.path"
          routerLinkActive="active"
        >
          <i class="bi {{ link.icon }}"></i>
          <span>{{ link.label }}</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Footer: public home link -->
  <div class="px-4 mt-3 border-top border-secondary pt-3">
    <a routerLink="/home" class="text-secondary small text-decoration-none">
      <i class="bi bi-arrow-left me-1"></i> Back to Site
    </a>
  </div>

</div>
