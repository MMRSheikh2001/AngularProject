<div class="card border-0 shadow-sm h-100">
  <div class="card-body d-flex align-items-center gap-3">
    <div class="rounded-circle d-flex align-items-center justify-content-center bg-{{ color }} bg-opacity-10 p-3">
      <i class="bi {{ icon }} text-{{ color }} stats-icon"></i>
    </div>
    <div>
      <p class="text-muted small mb-1">{{ title }}</p>
      <h4 class="fw-bold mb-0">{{ value }}</h4>
    </div>
  </div>
</div>
