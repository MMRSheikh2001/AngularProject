<div class="card border-0 shadow-sm h-100 card-hover">
  <div class="card-body">

    <!-- Header: logo + company -->
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="rounded border p-2 bg-white d-flex align-items-center justify-content-center" style="width:52px;height:52px;">
        <i class="bi bi-building text-primary fs-4"></i>
      </div>
      <div>
        <h6 class="mb-0 fw-semibold">{{ title }}</h6>
        <small class="text-muted">{{ company }}</small>
      </div>
    </div>

    <!-- Meta info -->
    <div class="d-flex flex-wrap gap-2 mb-3">
      <span class="badge bg-primary bg-opacity-10 text-primary">
        <i class="bi bi-briefcase me-1"></i>{{ jobType }}
      </span>
      <span class="badge bg-secondary bg-opacity-10 text-secondary">
        <i class="bi bi-geo-alt me-1"></i>{{ location }}
      </span>
    </div>

    <!-- Salary & deadline -->
    <div class="d-flex justify-content-between align-items-center text-muted small mb-3">
      <span><i class="bi bi-cash-coin me-1"></i>{{ salary }}</span>
      <span *ngIf="deadline"><i class="bi bi-calendar3 me-1"></i>{{ deadline }}</span>
    </div>

    <!-- Action -->
    <a [routerLink]="['/jobs', jobId]" class="btn btn-outline-primary btn-sm w-100">
      View Details
    </a>

  </div>
</div>
