<div class="card border-0 shadow-sm h-100 card-hover text-center">
  <div class="card-body">

    <!-- Avatar -->
    <div class="avatar-circle mx-auto mb-3" style="width:64px;height:64px;font-size:1.5rem;">
      {{ name.charAt(0) }}
    </div>

    <!-- Name & title -->
    <h6 class="fw-semibold mb-0">{{ name }}</h6>
    <small class="text-muted d-block mb-2">{{ title }}</small>

    <!-- Location -->
    <small class="text-muted"><i class="bi bi-geo-alt me-1"></i>{{ location }}</small>

    <!-- Rating -->
    <div class="d-flex align-items-center justify-content-center gap-1 my-2">
      <i class="bi bi-star-fill text-warning small"></i>
      <small class="fw-semibold">{{ rating }}</small>
      <small class="text-muted">({{ reviewCount }})</small>
    </div>

    <!-- Skills -->
    <div class="d-flex flex-wrap justify-content-center gap-1 mb-3">
      <span *ngFor="let skill of skills.slice(0, 4)" class="badge bg-light text-dark border small">
        {{ skill }}
      </span>
    </div>

    <!-- Hourly rate & action -->
    <div class="d-flex justify-content-between align-items-center">
      <span class="small text-muted" *ngIf="hourlyRate">৳{{ hourlyRate }}/hr</span>
      <span class="small text-muted" *ngIf="!hourlyRate">Rate: Negotiable</span>
      <a [routerLink]="['/freelancers', userId]" class="btn btn-sm btn-outline-primary">View Profile</a>
    </div>

  </div>
</div>
