<div class="card border-0 shadow-sm h-100 card-hover">
  <div class="card-body">

    <!-- Logo + name -->
    <div class="d-flex align-items-center gap-3 mb-3">
      <div class="rounded border p-2 bg-white d-flex align-items-center justify-content-center" style="width:52px;height:52px;">
        <i class="bi bi-building-fill text-secondary fs-4"></i>
      </div>
      <div>
        <h6 class="fw-semibold mb-0">{{ name }}</h6>
        <small class="text-muted">{{ industry }}</small>
      </div>
    </div>

    <!-- Meta -->
    <div class="d-flex flex-wrap gap-2 mb-3">
      <span class="badge bg-secondary bg-opacity-10 text-secondary small">
        <i class="bi bi-geo-alt me-1"></i>{{ location }}
      </span>
      <span *ngIf="size" class="badge bg-light text-dark border small">
        <i class="bi bi-people me-1"></i>{{ size }}
      </span>
    </div>

    <!-- Job count + link -->
    <div class="d-flex justify-content-between align-items-center">
      <span class="small text-muted">
        <i class="bi bi-briefcase me-1"></i>{{ jobCount }} open job{{ jobCount !== 1 ? 's' : '' }}
      </span>
      <a [routerLink]="['/companies', companyId]" class="btn btn-sm btn-outline-secondary">
        View Company
      </a>
    </div>

  </div>
</div>
