<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Saved Jobs</h5>
  <a routerLink="/jobs" class="btn btn-primary btn-sm"><i class="bi bi-search me-1"></i>Search Jobs</a>
</div>

<div class="row g-4" *ngIf="savedJobs.length > 0">
  <div class="col-md-6" *ngFor="let job of savedJobs">
    <div class="card border-0 shadow-sm h-100 position-relative">
      <button
        type="button"
        class="btn btn-outline-danger btn-sm position-absolute top-0 end-0 m-3 z-1"
        (click)="removeJob(job.jobId)"
        title="Remove from saved jobs"
      >
        <i class="bi bi-trash"></i>
      </button>

      <app-job-card
        [jobId]="job.jobId"
        [title]="job.title"
        [company]="job.company"
        [location]="job.location"
        [salary]="job.salary"
        [jobType]="job.jobType"
        [deadline]="job.deadline"
      ></app-job-card>
    </div>
  </div>
</div>

<!-- Empty state -->
<div class="card border-0 shadow-sm py-5 text-center" *ngIf="savedJobs.length === 0">
  <div class="card-body">
    <i class="bi bi-bookmark text-muted" style="font-size: 3rem;"></i>
    <h5 class="mt-3 text-muted">No Saved Jobs</h5>
    <p class="text-muted small">You haven't saved any job opportunities yet.</p>
    <a routerLink="/jobs" class="btn btn-primary btn-sm">Find Jobs</a>
  </div>
</div>
