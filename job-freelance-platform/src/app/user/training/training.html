<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Training</h5>
</div>
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <h6 class="fw-semibold mb-3">Add New Training</h6>
    <form>
      <div class="row g-3">
        <div class="col-md-4">
          <label class="form-label">Training Title</label>
          <input type="text" class="form-control" placeholder="e.g. Full Stack Web Development">
        </div>
        <div class="col-md-4">
          <label class="form-label">Institute</label>
          <input type="text" class="form-control" placeholder="e.g. Programming Hero">
        </div>
        <div class="col-md-4">
          <label class="form-label">Duration</label>
          <input type="text" class="form-control" placeholder="e.g. 6 Months">
        </div>
        <div class="col-12 mt-3">
          <button type="button" class="btn btn-primary btn-sm">Save Training</button>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th class="px-4">Title</th>
          <th>Institute</th>
          <th>Duration</th>
          <th class="text-center px-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let t of trainings">
          <td class="px-4 fw-semibold">{{ t.title }}</td>
          <td>{{ t.institute }}</td>
          <td>{{ t.duration }}</td>
          <td class="text-center px-4">
            <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
