<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Skills</h5>
</div>
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <h6 class="fw-semibold mb-3">Add New Skill</h6>
    <form>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Skill Name</label>
          <input type="text" class="form-control" placeholder="e.g. Angular">
        </div>
        <div class="col-md-6">
          <label class="form-label">Proficiency Level</label>
          <select class="form-select">
            <option>Beginner</option>
            <option>Intermediate</option>
            <option>Expert</option>
          </select>
        </div>
        <div class="col-12 mt-3">
          <button type="button" class="btn btn-primary btn-sm">Save Skill</button>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th class="px-4">Skill</th>
          <th>Level</th>
          <th class="text-center px-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let s of skills">
          <td class="px-4 fw-semibold">{{ s.name }}</td>
          <td>{{ s.level }}</td>
          <td class="text-center px-4">
            <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
