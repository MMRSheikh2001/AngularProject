<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">My Applications</h5>
  <a routerLink="/jobs" class="btn btn-primary btn-sm"><i class="bi bi-search me-1"></i>Find More Jobs</a>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">Job Title</th>
            <th>Company</th>
            <th>Location</th>
            <th>Salary</th>
            <th>Applied Date</th>
            <th>Status</th>
            <th class="text-center px-4">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let app of applications">
            <td class="px-4 fw-semibold">{{ app.title }}</td>
            <td class="text-muted">{{ app.company }}</td>
            <td class="text-muted"><i class="bi bi-geo-alt me-1"></i>{{ app.location }}</td>
            <td class="text-muted">{{ app.salary }}</td>
            <td class="text-muted">{{ app.appliedDate }}</td>
            <td>
              <span class="badge rounded-pill px-3 py-2 text-capitalize" [class]="getStatusClass(app.status)">
                {{ app.status }}
              </span>
            </td>
            <td class="text-center px-4">
              <a [routerLink]="['/jobs', app.id]" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-eye"></i> View Details
              </a>
            </td>
          </tr>
          <tr *ngIf="applications.length === 0">
            <td colspan="7" class="text-center py-5">
              <i class="bi bi-send text-muted" style="font-size: 3rem;"></i>
              <h5 class="mt-3 text-muted">No Applications Found</h5>
              <p class="text-muted small">You have not applied to any jobs yet.</p>
              <a routerLink="/jobs" class="btn btn-primary btn-sm">Browse Jobs</a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
