<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Edit Profile</h5>
  <a routerLink="/user/profile" class="btn btn-outline-secondary btn-sm">Cancel</a>
</div>

<form (ngSubmit)="onSave()">
  <div class="row g-4">

    <!-- Personal Info -->
    <div class="col-lg-8">
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <h6 class="fw-semibold mb-3">Personal Information</h6>
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label fw-semibold">Name</label>
              <input type="text" class="form-control" [(ngModel)]="name" name="name" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Professional Title</label>
              <input type="text" class="form-control" [(ngModel)]="title" name="title" placeholder="e.g. Full Stack Developer" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Phone Number</label>
              <input type="tel" class="form-control" [(ngModel)]="phone" name="phone" />
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Bio</label>
              <textarea class="form-control" rows="3" [(ngModel)]="bio" name="bio"></textarea>
            </div>
          </div>
        </div>
      </div>

      <!-- Bangladesh Address -->
      <div class="card border-0 shadow-sm mb-4">
        <div class="card-body">
          <h6 class="fw-semibold mb-3">Address (Bangladesh)</h6>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label fw-semibold">Division</label>
              <select class="form-select" [(ngModel)]="division" name="division">
                <option *ngFor="let d of divisions" [value]="d">{{ d }}</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">District</label>
              <input type="text" class="form-control" [(ngModel)]="district" name="district" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Police Station / Upazila</label>
              <input type="text" class="form-control" [(ngModel)]="upazila" name="upazila" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Postcode</label>
              <input type="text" class="form-control" [(ngModel)]="postcode" name="postcode" />
            </div>
            <div class="col-12">
              <label class="form-label fw-semibold">Full Address</label>
              <input type="text" class="form-control" [(ngModel)]="fullAddress" name="fullAddress" />
            </div>
          </div>
        </div>
      </div>

      <!-- Professional -->
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h6 class="fw-semibold mb-3">Professional Details</h6>
          <div class="row g-3">
            <div class="col-12">
              <label class="form-label fw-semibold">Skills <small class="text-muted">(comma separated)</small></label>
              <input type="text" class="form-control" [(ngModel)]="skills" name="skills" placeholder="React, Node.js, MySQL..." />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">GitHub URL</label>
              <input type="url" class="form-control" [(ngModel)]="github" name="github" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">LinkedIn URL</label>
              <input type="url" class="form-control" [(ngModel)]="linkedin" name="linkedin" />
            </div>
            <div class="col-md-6">
              <label class="form-label fw-semibold">Hourly Rate (৳/hr)</label>
              <input type="number" class="form-control" [(ngModel)]="hourlyRate" name="hourlyRate" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar -->
    <div class="col-lg-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body text-center p-4">
          <div class="avatar-circle mx-auto mb-3" style="width:80px;height:80px;font-size:2rem;">M</div>
          <button type="button" class="btn btn-outline-secondary btn-sm w-100 mb-2">
            <i class="bi bi-upload me-1"></i>Upload Photo
          </button>
          <small class="text-muted d-block">JPG, PNG. Max 2MB</small>
        </div>
      </div>
    </div>

  </div>

  <div class="mt-4">
    <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2 me-1"></i>Save Changes</button>
  </div>
</form>
