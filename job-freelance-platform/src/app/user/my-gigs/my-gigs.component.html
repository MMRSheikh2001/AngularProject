<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">My Freelance Gigs</h5>
  <a routerLink="/user/create-gig" class="btn btn-success btn-sm"><i class="bi bi-plus-circle me-1"></i>Create New Gig</a>
</div>

<div class="row g-4" *ngIf="gigs.length > 0">
  <div class="col-lg-4 col-md-6" *ngFor="let gig of gigs">
    <div class="card border-0 shadow-sm h-100 card-hover">
      <!-- Gig Image Placeholder -->
      <div class="bg-light d-flex align-items-center justify-content-center text-muted" style="height: 160px; border-radius: 8px 8px 0 0;">
        <i class="bi bi-image" style="font-size: 3rem;"></i>
      </div>
      <div class="card-body">
        <span class="badge bg-info bg-opacity-10 text-info small mb-2">{{ gig.category }}</span>
        <h6 class="fw-semibold mb-3">{{ gig.title }}</h6>
        <div class="d-flex justify-content-between align-items-center border-top pt-3">
          <div>
            <span class="text-muted small">Starting Price</span>
            <p class="fw-bold text-primary mb-0">৳{{ gig.price }}</p>
          </div>
          <div>
            <span class="badge" [class.bg-success]="gig.status === 'Active'" [class.bg-warning]="gig.status === 'Paused'">
              {{ gig.status }}
            </span>
          </div>
        </div>
      </div>
      <div class="card-footer bg-white border-0 d-flex gap-2 pb-3">
        <a [routerLink]="['/user/edit-gig', gig.id]" class="btn btn-outline-primary btn-sm flex-fill">
          <i class="bi bi-pencil me-1"></i>Edit Gig
        </a>
        <button type="button" class="btn btn-outline-secondary btn-sm" (click)="toggleStatus(gig)" [title]="gig.status === 'Active' ? 'Pause Gig' : 'Activate Gig'">
          <i class="bi" [class.bi-pause-fill]="gig.status === 'Active'" [class.bi-play-fill]="gig.status === 'Paused'"></i>
        </button>
      </div>
    </div>
  </div>
</div>

<div class="card border-0 shadow-sm py-5 text-center" *ngIf="gigs.length === 0">
  <div class="card-body">
    <i class="bi bi-grid text-muted" style="font-size: 3rem;"></i>
    <h5 class="mt-3 text-muted">No Gigs Found</h5>
    <p class="text-muted small">Start selling your professional freelance services by creating your first gig.</p>
    <a routerLink="/user/create-gig" class="btn btn-success btn-sm">Create First Gig</a>
  </div>
</div>
