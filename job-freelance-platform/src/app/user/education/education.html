<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Education</h5>
</div>
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <h6 class="fw-semibold mb-3">Add New Education</h6>
    <form>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Degree</label>
          <input type="text" class="form-control" placeholder="e.g. B.Sc in CS">
        </div>
        <div class="col-md-6">
          <label class="form-label">Institution</label>
          <input type="text" class="form-control" placeholder="e.g. Dhaka University">
        </div>
        <div class="col-md-6">
          <label class="form-label">Passing Year</label>
          <input type="number" class="form-control" placeholder="2021">
        </div>
        <div class="col-md-6">
          <label class="form-label">Result/CGPA</label>
          <input type="text" class="form-control" placeholder="3.8">
        </div>
        <div class="col-12 mt-3">
          <button type="button" class="btn btn-primary btn-sm">Save Education</button>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th class="px-4">Degree</th>
          <th>Institution</th>
          <th>Year</th>
          <th>CGPA</th>
          <th class="text-center px-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let edu of educations">
          <td class="px-4 fw-semibold">{{ edu.degree }}</td>
          <td>{{ edu.institution }}</td>
          <td>{{ edu.year }}</td>
          <td>{{ edu.cgpa }}</td>
          <td class="text-center px-4">
            <button class="btn btn-outline-secondary btn-sm me-2"><i class="bi bi-pencil"></i></button>
            <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
