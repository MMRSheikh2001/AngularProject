<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">References</h5>
</div>
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <h6 class="fw-semibold mb-3">Add Reference</h6>
    <form>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Name</label>
          <input type="text" class="form-control" placeholder="e.g. John Doe">
        </div>
        <div class="col-md-6">
          <label class="form-label">Designation</label>
          <input type="text" class="form-control" placeholder="e.g. Professor">
        </div>
        <div class="col-md-6">
          <label class="form-label">Company/Institution</label>
          <input type="text" class="form-control" placeholder="e.g. XYZ University">
        </div>
        <div class="col-md-6">
          <label class="form-label">Email/Phone</label>
          <input type="text" class="form-control" placeholder="e.g. john@example.com">
        </div>
        <div class="col-12 mt-3">
          <button type="button" class="btn btn-primary btn-sm">Save Reference</button>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th class="px-4">Name</th>
          <th>Designation</th>
          <th>Company</th>
          <th>Contact</th>
          <th class="text-center px-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let ref of references">
          <td class="px-4 fw-semibold">{{ ref.name }}</td>
          <td>{{ ref.designation }}</td>
          <td>{{ ref.company }}</td>
          <td>{{ ref.email }}</td>
          <td class="text-center px-4">
            <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
