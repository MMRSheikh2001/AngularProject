<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Extracurricular Activities</h5>
</div>
<div class="card border-0 shadow-sm mb-4">
  <div class="card-body">
    <h6 class="fw-semibold mb-3">Add Activity</h6>
    <form>
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label">Activity Name</label>
          <input type="text" class="form-control" placeholder="e.g. Debate Club">
        </div>
        <div class="col-md-6">
          <label class="form-label">Role/Position</label>
          <input type="text" class="form-control" placeholder="e.g. President">
        </div>
        <div class="col-12">
          <label class="form-label">Description</label>
          <textarea class="form-control" rows="2"></textarea>
        </div>
        <div class="col-12 mt-3">
          <button type="button" class="btn btn-primary btn-sm">Save Activity</button>
        </div>
      </div>
    </form>
  </div>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <table class="table table-hover align-middle mb-0">
      <thead class="table-light">
        <tr>
          <th class="px-4">Activity Name</th>
          <th>Role</th>
          <th>Description</th>
          <th class="text-center px-4">Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let act of activities">
          <td class="px-4 fw-semibold">{{ act.name }}</td>
          <td>{{ act.role }}</td>
          <td class="text-muted">{{ act.desc }}</td>
          <td class="text-center px-4">
            <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash"></i></button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
