<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Manage Freelance Gigs</h5>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">Gig Title</th>
            <th>Seller</th>
            <th>Basic Price</th>
            <th>Status</th>
            <th class="text-center px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let gig of gigs">
            <td class="px-4 fw-semibold">{{ gig.title }}</td>
            <td class="text-muted">{{ gig.seller }}</td>
            <td class="fw-bold">{{ gig.price }}</td>
            <td>
              <span class="badge px-3 py-2" [class.bg-success]="gig.status === 'Active'" [class.bg-warning]="gig.status === 'Flagged'">
                {{ gig.status }}
              </span>
            </td>
            <td class="text-center px-4">
              <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-outline-secondary btn-sm" (click)="toggleStatus(gig)">
                  {{ gig.status === 'Active' ? 'Flag' : 'Approve' }}
                </button>
                <button type="button" class="btn btn-danger btn-sm" (click)="deleteGig(gig.id)">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
