<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Manage Platform Users</h5>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">User Details</th>
            <th>Role</th>
            <th>Date Joined</th>
            <th>Status</th>
            <th class="text-center px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let user of users">
            <td class="px-4">
              <div class="d-flex align-items-center gap-3">
                <div class="avatar-circle" style="width:40px;height:40px;">
                  {{ user.name.charAt(0) }}
                </div>
                <div>
                  <p class="fw-semibold mb-0">{{ user.name }}</p>
                  <small class="text-muted">{{ user.email }}</small>
                </div>
              </div>
            </td>
            <td>
              <span class="badge" [class.bg-primary]="user.role === 'User'" [class.bg-secondary]="user.role === 'Company'">
                {{ user.role }}
              </span>
            </td>
            <td class="text-muted">{{ user.dateJoined }}</td>
            <td>
              <span class="badge px-3 py-2" [class.bg-success]="user.status === 'Active'" [class.bg-danger]="user.status === 'Suspended'">
                {{ user.status }}
              </span>
            </td>
            <td class="text-center px-4">
              <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-outline-secondary btn-sm" (click)="toggleStatus(user)">
                  {{ user.status === 'Active' ? 'Suspend' : 'Activate' }}
                </button>
                <button type="button" class="btn btn-danger btn-sm" (click)="deleteUser(user.id)">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
