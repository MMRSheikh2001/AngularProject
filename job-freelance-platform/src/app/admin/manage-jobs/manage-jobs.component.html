<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Manage Job Listings</h5>
</div>

<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">Job Title</th>
            <th>Company</th>
            <th>Type</th>
            <th>Posted Date</th>
            <th>Status</th>
            <th class="text-center px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let job of jobs">
            <td class="px-4 fw-semibold">{{ job.title }}</td>
            <td class="text-muted">{{ job.company }}</td>
            <td><span class="badge bg-secondary bg-opacity-10 text-secondary">{{ job.type }}</span></td>
            <td class="text-muted">{{ job.postedDate }}</td>
            <td>
              <span class="badge px-3 py-2" [class.bg-success]="job.status === 'Active'" [class.bg-warning]="job.status === 'Flagged'">
                {{ job.status }}
              </span>
            </td>
            <td class="text-center px-4">
              <div class="d-flex gap-2 justify-content-center">
                <button type="button" class="btn btn-outline-secondary btn-sm" (click)="toggleStatus(job)">
                  {{ job.status === 'Active' ? 'Flag' : 'Approve' }}
                </button>
                <button type="button" class="btn btn-danger btn-sm" (click)="deleteJob(job.id)">
                  Delete
                </button>
              </div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
