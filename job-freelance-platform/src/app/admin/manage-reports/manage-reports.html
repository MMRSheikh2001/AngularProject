<div class="d-flex justify-content-between align-items-center mb-4">
  <h5 class="page-title mb-0">Manage Reports</h5>
</div>
<div class="card border-0 shadow-sm">
  <div class="card-body p-0">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="px-4">Report ID</th>
            <th>Reported Item</th>
            <th>Reason</th>
            <th>Date</th>
            <th>Status</th>
            <th class="text-center px-4">Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let r of reports">
            <td class="px-4 fw-semibold">{{ r.id }}</td>
            <td>{{ r.reported }}</td>
            <td class="text-danger">{{ r.reason }}</td>
            <td>{{ r.date }}</td>
            <td>
              <span class="badge" [class.bg-warning]="r.status === 'Pending'" [class.bg-info]="r.status === 'Reviewed'">{{ r.status }}</span>
            </td>
            <td class="text-center px-4">
              <button class="btn btn-outline-secondary btn-sm me-2">Review</button>
              <button class="btn btn-outline-danger btn-sm">Ban</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
