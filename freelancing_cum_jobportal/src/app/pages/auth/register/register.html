<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
    <div class="card shadow-sm border-0 w-100" style="max-width: 480px; border-radius: 16px;">
        <div class="card-body p-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <h4 class="fw-bold text-primary">
                    <i class="bi bi-briefcase-fill me-2"></i>WorkBridge
                </h4>
                <h5 class="fw-semibold">Create Your Account</h5>
                <p class="text-muted small">Join thousands of professionals</p>
            </div>

            <!-- Error -->
            <div *ngIf="error" class="alert alert-danger py-2 small">{{ error }}</div>

            <!-- Form -->
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Full Name</label>
                    <input formControlName="name" type="text" class="form-control" placeholder="Ahmed Rahman">
                    <div *ngIf="f['name'].touched && f['name'].invalid" class="text-danger small mt-1">Name is required
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email</label>
                    <input formControlName="email" type="email" class="form-control" placeholder="ahmed@email.com">
                    <div *ngIf="f['email'].touched && f['email'].invalid" class="text-danger small mt-1">Valid email is
                        required</div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Phone</label>
                    <input formControlName="phone" type="text" class="form-control" placeholder="01712345678">
                    <div *ngIf="f['phone'].touched && f['phone'].invalid" class="text-danger small mt-1">Phone is
                        required</div>
                </div>

                <div class="row mb-3">
                    <div class="col">
                        <label class="form-label small fw-semibold">City</label>
                        <select formControlName="city" class="form-select">
                            <option value="">Select city</option>
                            <option>Dhaka</option>
                            <option>Chittagong</option>
                            <option>Sylhet</option>
                            <option>Rajshahi</option>
                            <option>Khulna</option>
                        </select>
                        <div *ngIf="f['city'].touched && f['city'].invalid" class="text-danger small mt-1">City is
                            required</div>
                    </div>
                    <div class="col">
                        <label class="form-label small fw-semibold">Area</label>
                        <input formControlName="area" type="text" class="form-control" placeholder="Gulshan">
                        <div *ngIf="f['area'].touched && f['area'].invalid" class="text-danger small mt-1">Area is
                            required</div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Password</label>
                    <input formControlName="password" type="password" class="form-control"
                        placeholder="Min 6 characters">
                    <div *ngIf="f['password'].touched && f['password'].invalid" class="text-danger small mt-1">Min 6
                        characters required</div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Confirm Password</label>
                    <input formControlName="confirmPassword" type="password" class="form-control"
                        placeholder="Repeat password">
                    <div *ngIf="f['confirmPassword'].touched && !passwordsMatch()" class="text-danger small mt-1">
                        Passwords do not match</div>
                </div>

                <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    {{ loading ? 'Creating account...' : 'Register' }}
                </button>

            </form>

            <p class="text-center mt-3 small text-muted">
                Already have an account?
                <a routerLink="/login" class="text-primary fw-semibold">Login</a>
            </p>

        </div>
    </div>
</div>
