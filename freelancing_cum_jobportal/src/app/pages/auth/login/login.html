<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="card shadow-sm border-0 w-100" style="max-width: 420px; border-radius: 16px;">
        <div class="card-body p-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <h4 class="fw-bold text-primary">
                    <i class="bi bi-briefcase-fill me-2"></i>WorkBridge
                </h4>
                <h5 class="fw-semibold">Welcome Back</h5>
                <p class="text-muted small">Login to your account</p>
            </div>

            <!-- Error -->
            <div *ngIf="error" class="alert alert-danger py-2 small">{{ error }}</div>

            <!-- Form -->
            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email</label>
                    <input formControlName="email" type="email" class="form-control" placeholder="ahmed@email.com">
                    <div *ngIf="f['email'].touched && f['email'].invalid" class="text-danger small mt-1">Valid email is
                        required</div>
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-semibold">Password</label>
                    <div class="input-group">
                        <input formControlName="password" [type]="showPassword ? 'text' : 'password'"
                            class="form-control" placeholder="Your password">
                        <button class="btn btn-outline-secondary" type="button" (click)="showPassword = !showPassword">
                            <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                        </button>
                    </div>
                    <div *ngIf="f['password'].touched && f['password'].invalid" class="text-danger small mt-1">Password
                        is required</div>
                </div>

                <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    {{ loading ? 'Logging in...' : 'Login' }}
                </button>

            </form>

            <div class="text-center mt-3">
                <a routerLink="/forgot-password" class="text-muted small">
                    Forgot password?
                </a>
            </div>

            <p class="text-center mt-2 small text-muted">
                No account?
                <a routerLink="/register" class="text-primary fw-semibold">Register</a>
            </p>

        </div>
    </div>
</div>
