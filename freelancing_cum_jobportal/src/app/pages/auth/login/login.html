<div class="min-vh-100 d-flex align-items-center justify-content-center bg-light">
    <div class="card shadow-sm border-0 w-100" style="max-width: 420px; border-radius: 16px;">
        <div class="card-body p-4">

            <!-- Logo -->
            <div class="text-center mb-4">
                <h4 class="fw-bold text-primary">
                    <i class="bi bi-briefcase-fill me-2"></i>WorkBridge
                </h4>
                <h5 class="fw-semibold">Welcome Back</h5>
                <p class="text-muted small">Login to your account</p>
            </div>

            <!-- Error -->
            <div *ngIf="error" class="alert alert-danger py-2 small d-flex align-items-center gap-2">
                <i class="bi bi-exclamation-circle-fill"></i>{{ error }}
            </div>

            <form [formGroup]="form" (ngSubmit)="onSubmit()">

                <!-- Email -->
                <div class="mb-3">
                    <label class="form-label small fw-semibold">Email</label>
                    <input formControlName="email" type="email" class="form-control"
                        [class.is-invalid]="f['email'].touched && f['email'].invalid" placeholder="ahmed@email.com">
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <!-- Password -->
                <div class="mb-4">
                    <div class="d-flex justify-content-between">
                        <label class="form-label small fw-semibold">Password</label>
                        <a routerLink="/forgot-password" class="text-muted small">
                            Forgot password?
                        </a>
                    </div>
                    <div class="input-group">
                        <input formControlName="password" [type]="showPassword ? 'text' : 'password'"
                            class="form-control" [class.is-invalid]="f['password'].touched && f['password'].invalid"
                            placeholder="Your password">
                        <button class="btn btn-outline-secondary" type="button" (click)="showPassword = !showPassword">
                            <i class="bi" [class.bi-eye]="!showPassword" [class.bi-eye-slash]="showPassword"></i>
                        </button>
                        <div class="invalid-feedback">Password is required.</div>
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="btn btn-primary w-100 py-2" [disabled]="loading">
                    <span *ngIf="loading" class="spinner-border spinner-border-sm me-2"></span>
                    {{ loading ? 'Logging in...' : 'Login' }}
                </button>

            </form>

            <!-- Test credentials hint -->
            <div class="mt-3 p-2 bg-light rounded small text-muted">
                <strong>Test accounts:</strong><br>
                User: ahmed@email.com / password123<br>
                Admin: admin@workbridge.com / admin123
            </div>

            <p class="text-center mt-3 small text-muted">
                No account?
                <a routerLink="/register" class="text-primary fw-semibold">Register here</a>
            </p>

        </div>
    </div>
</div>
